[package]
name = "submit-audio-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "1.8.11"
aws-sdk-s3 = "1.115.0"
buffa = { version = "0.9.1", features = ["json"] }
connectrpc = "0.9.0"
lambda_http = "1.3.1"
serde = "1.0.229"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.49.0", features = ["macros"] }
tower = "0.5.2"

[build-dependencies]
connectrpc-build = "0.9.0"
