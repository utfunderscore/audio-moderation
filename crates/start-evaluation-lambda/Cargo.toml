[package]
name = "start-evaluation-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "1.8.11"
aws-sdk-sfn = "1.115.0"
aws-sdk-ssm = "1.121.0"
buffa = { version = "0.9.1", features = ["json"] }
connectrpc = "0.9.0"
common = { path = "../common" }
database = { path = "../database" }
task-event-emitter = { path = "../task-event-emitter" }
http-body-util = "0.1.3"
lambda_http = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "time"] }
tower = "0.5.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
connectrpc-build = "0.9.0"

[dev-dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.22.0", features = ["v4"] }
