[package]
name = "audio-processing-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "1.8.11"
aws-sdk-s3 = "1.115.0"
lambda_runtime = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.24.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "macros", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
serde_json = "1.0.151"
