[project]
name = "socialguard-models"
version = "0.1.0"
description = "Models and integrations for SocialGuard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "modal>=1.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "basedpyright>=1.22",
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = "warning"
