[package]
name = "confirm-upload-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "1.8.11"
aws-sdk-s3 = "1.115.0"
aws-sdk-sfn = "1.115.0"
aws-sdk-ssm = "1.121.0"
aws_lambda_events = { version = "1.2.0", features = ["s3"] }
common = { path = "../common" }
database = { path = "../database" }
lambda_runtime = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.18"
task-event-emitter = { path = "../task-event-emitter" }
tokio = { version = "1.49.0", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
urlencoding = "2.1.3"
