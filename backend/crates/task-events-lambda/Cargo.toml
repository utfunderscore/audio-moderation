[package]
name = "task-events-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "1.8.11"
aws-sdk-ssm = "1.121.0"
common = { path = "../common" }
database = { path = "../database" }
task-event-emitter = { path = "../task-event-emitter" }
lambda_runtime = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.49.0", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
futures-util = "0.3.31"
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.22.0", features = ["v4"] }
